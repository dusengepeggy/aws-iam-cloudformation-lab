AWSTemplateFormatVersion: '2010-09-09'
Description: IAM Lab - Users, Groups, Permissions, and Secrets

Resources:

  UserTempPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: iam-user-temp-password
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 12
        ExcludeCharacters: '"@/\\'

  EC2Group:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2Group
      Policies:
        - PolicyName: EC2Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:RunInstances
                Resource: "*"

  S3Group:
    Type: AWS::IAM::Group
    Properties:
      GroupName: S3Group
      Policies:
        - PolicyName: S3Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: "*"
  AllUsersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: All-Users
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  EC2User1:
    Type: AWS::IAM::User
    DependsOn: UserTempPassword
    Properties:
      UserName: ec2-user1
      LoginProfile:
        Password: "{{resolve:secretsmanager:iam-user-temp-password:SecretString:password}}"
        PasswordResetRequired: true
      Groups:
        - !Ref EC2Group
        - !Ref AllUsersGroup

  EC2User2:
    Type: AWS::IAM::User
    DependsOn: UserTempPassword
    Properties:
      UserName: ec2-user2
      LoginProfile:
        Password: "{{resolve:secretsmanager:iam-user-temp-password:SecretString:password}}"
        PasswordResetRequired: true
      Groups:
        - !Ref EC2Group
        - !Ref AllUsersGroup
      Policies:
        - PolicyName: DenyEC2Create
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action: ec2:RunInstances
                Resource: "*"

  S3User:
    Type: AWS::IAM::User
    DependsOn: UserTempPassword
    Properties:
      UserName: s3-user
      LoginProfile:
        Password: "{{resolve:secretsmanager:iam-user-temp-password:SecretString:password}}"
        PasswordResetRequired: true
      Groups:
        - !Ref S3Group
        - !Ref AllUsersGroup

  S3User2:
    Type: AWS::IAM::User
    DependsOn: UserTempPassword
    Properties:
      UserName: s3-user-2
      LoginProfile:
        Password: "{{resolve:secretsmanager:iam-user-temp-password:SecretString:password}}"
        PasswordResetRequired: true
      Groups:
        - !Ref S3Group
        - !Ref AllUsersGroup
        

